<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Speakora</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#c8df7b;
      overflow:hidden;
    }

    .container{
      position:relative;
      width:100vw;
      height:100vh;
    }

    /* ФОН */

    .bg{
      position:absolute;
      inset:0;

      width:80%;
      height:80%;

      object-fit:cover;

      z-index:1;
    }

    /* TOP MENU */

    .top-menu{
      position:absolute;

      top:0;
      left:0;

      width:100%;
      height:105px;

      z-index:5;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 35px;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:14px;

      color:white;
      font-size:30px;
      font-weight:700;
    }

    .menu-items{
      display:flex;
      gap:40px;
    }

    .menu-items a{
      color:white;
      text-decoration:none;
      font-size:20px;
      font-weight:600;

      transition:.3s;
    }

    .menu-items a:hover{
      transform:translateY(-2px);
      opacity:.8;
    }

    /* RIGHT PANEL */

    .right-panel{
      position:absolute;

      top:135px;
      right:45px;

      width:340px;
      height:760px;

      z-index:5;

      display:flex;
      flex-direction:column;
      gap:24px;
    }

    .progress-card{
      width:100%;
      height:220px;

      border-radius:35px;

      background:rgba(0,60,20,.35);

      backdrop-filter:blur(6px);
    }

    /* CENTER CONTENT */

    .center-circle{
      position:absolute;

      top:145px;
      left:180px;

      width:760px;
      height:760px;

      border:5px dashed rgba(255,255,255,.9);
      border-radius:50%;

      z-index:4;
    }

    .main-card{
      position:absolute;

      top:370px;
      left:345px;

      width:430px;
      height:370px;

      border-radius:30px;

      background:rgba(255,255,255,.15);

      z-index:6;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .main-card img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    /* RESPONSIVE */

    @media(max-width:1400px){

      .center-circle{
        transform:scale(.8);
        transform-origin:top left;
      }

      .main-card{
        transform:scale(.8);
        transform-origin:top left;
      }

      .right-panel{
        transform:scale(.85);
        transform-origin:top right;
      }

      .menu-items{
        gap:20px;
      }

      .menu-items a{
        font-size:16px;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <!-- BACKGROUND -->

  <img src="background.png" class="bg">

  <!-- TOP -->

  <div class="top-menu">

    <div class="logo">
      💬 SPEAKORA
    </div>

    <div class="menu-items">

      <a href="#">Dashboard</a>

      <a href="#">Courses</a>

      <a href="#">My Learning</a>

      <a href="#">Homework</a>

      <a href="#">Vocabulary</a>

      <a href="#">Certificates</a>

    </div>

  </div>

  <!-- RIGHT -->

  <div class="right-panel">

    <div class="progress-card"></div>

    <div class="progress-card"></div>

    <div class="progress-card"></div>

  </div>

  <!-- CENTER -->

  <div class="center-circle"></div>

  <div class="main-card">

    <img src="background.png">

  </div>

</div>

</body>

</html>
