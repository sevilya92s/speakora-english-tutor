```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPEAKORA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#ffffff;
}

/* LOGO */

.header{
    padding:30px 60px;
}

.logo{
    font-size:42px;
    font-weight:700;
    color:#16a34a;
}

/* QUOTES */

.quote-bar{
    height:90px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:28px;
    font-style:italic;
    font-weight:600;

    color:#16a34a;
}

/* IMAGE */

.hero{
    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px 20px 60px;
}

.hero img{
    width:100%;
    max-width:1000px;
}

/* BUTTONS */

.cards{

    max-width:1300px;

    margin:auto;

    padding:0 40px 80px;

    display:grid;

    grid-template-columns:repeat(6,1fr);

    gap:20px;
}

.card{

    background:white;

    border-radius:25px;

    padding:25px;

    text-align:center;

    text-decoration:none;

    color:#111827;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

    border:1px solid #f3f3f3;

    transition:.3s;
}

.card:hover{

    transform:translateY(-8px);

    box-shadow:0 15px 30px rgba(0,0,0,.12);
}

.icon{
    font-size:42px;
    margin-bottom:12px;
}

.title{
    font-size:18px;
    font-weight:700;
}

/* MOBILE */

@media(max-width:1100px){

.cards{
    grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:700px){

.cards{
    grid-template-columns:repeat(2,1fr);
}

.logo{
    font-size:28px;
}

.quote-bar{
    font-size:20px;
}

}

</style>
</head>

<body>

<div class="header">
    <div class="logo">SPEAKORA</div>
</div>

<div class="quote-bar">
    <span id="quote">"Learn something new today."</span>
</div>

<div class="hero">

    <!-- ВСТАВЬ СВОЮ КАРТИНКУ -->
    <img src="background.png" alt="Speakora">

</div>

<div class="cards">

<a href="dashboard.html" class="card">
<div class="icon">📊</div>
<div class="title">Dashboard</div>
</a>

<a href="courses.html" class="card">
<div class="icon">📚</div>
<div class="title">Courses</div>
</a>

<a href="learning.html" class="card">
<div class="icon">🎯</div>
<div class="title">My Learning</div>
</a>

<a href="homework.html" class="card">
<div class="icon">📝</div>
<div class="title">Homework</div>
</a>

<a href="vocabulary.html" class="card">
<div class="icon">💬</div>
<div class="title">Vocabulary</div>
</a>

<a href="certificates.html" class="card">
<div class="icon">🏆</div>
<div class="title">Certificates</div>
</a>

</div>

<script>

const quotes = [

"Learn something new today.",
"Every word counts.",
"Practice makes progress.",
"Keep learning. Keep growing.",
"Small steps. Big progress.",
"One lesson closer to fluency.",
"Speak English with confidence.",
"Your future starts today."

];

let current = 0;

setInterval(() => {

current++;

if(current >= quotes.length){
current = 0;
}

document.getElementById("quote").innerHTML =
'"' + quotes[current] + '"';

}, 5000);

</script>

</body>
</html>
