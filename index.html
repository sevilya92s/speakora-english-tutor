<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEAKORA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f8f8f8;
color:#111;
}

/* HEADER */

.header{
display:flex;
align-items:center;
padding:35px 50px;
}

.logo{
display:flex;
align-items:center;
gap:15px;
font-size:28px;
font-weight:700;
color:#138a36;
}

.logo-icon{
font-size:42px;
}

/* HERO */

.hero{
display:flex;
justify-content:space-between;
align-items:center;

padding:30px 80px 60px;
max-width:1500px;
margin:auto;
}

.hero-text h1{
font-size:96px;
line-height:1;
font-weight:800;
}

.hero-text span{
color:#18a63f;
}

.hero-image img{
width:700px;
max-width:100%;
}

/* CARDS */

.cards{
max-width:1400px;
margin:0 auto 80px;

display:grid;
grid-template-columns:repeat(6,1fr);
gap:22px;

padding:0 40px;
}

.card{
background:white;

border-radius:28px;

height:260px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

text-decoration:none;
color:#111;

box-shadow:0 5px 25px rgba(0,0,0,.05);

transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.icon{
font-size:70px;
margin-bottom:20px;
}

.card-title{
font-size:20px;
font-weight:600;
}

/* MOBILE */

@media(max-width:1200px){

.hero{
flex-direction:column;
text-align:center;
}

.hero-text h1{
font-size:70px;
margin-bottom:30px;
}

.cards{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:700px){

.cards{
grid-template-columns:repeat(2,1fr);
}

.hero-text h1{
font-size:48px;
}

}

</style>
</head>

<body>

<div class="header">

<div class="logo">
<span class="logo-icon">💬</span>
<span>SPEAKORA</span>
</div>

</div>

<section class="hero">

<div class="hero-text">

<h1>
Learn English<br>
<span>Smarter</span>
</h1>

</div>

<div class="hero-image">

<img src="background.png" alt="Speakora">

</div>

</section>

<div class="cards">

<a href="#" class="card">
<div class="icon">📊</div>
<div class="card-title">Dashboard</div>
</a>

<a href="#" class="card">
<div class="icon">📖</div>
<div class="card-title">Courses</div>
</a>

<a href="#" class="card">
<div class="icon">🎯</div>
<div class="card-title">My Learning</div>
</a>

<a href="#" class="card">
<div class="icon">📝</div>
<div class="card-title">Homework</div>
</a>

<a href="#" class="card">
<div class="icon">💬</div>
<div class="card-title">Vocabulary</div>
</a>

<a href="#" class="card">
<div class="icon">🏆</div>
<div class="card-title">Certificates</div>
</a>

</div>

</body>
</html>
