```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEAKORA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#ffffff;
    color:#111827;
}

/* LOGO */

.header{
    padding:30px 60px;
}

.logo{
    font-size:42px;
    font-weight:700;
    color:#16a34a;
}

/* MOTIVATION BAR */

.motivation-bar{
    width:100%;
    height:70px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;
    font-weight:600;

    color:#16a34a;
}

/* HERO SECTION */

.hero{
    max-width:1400px;
    margin:auto;

    padding:30px 60px 50px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:40px;
}

.hero-text{
    flex:1;
}

.hero-text h1{
    font-size:90px;
    line-height:1.05;
}

.hero-text span{
    color:#16a34a;
}

.hero-image{
    flex:1;
    text-align:center;
}

.hero-image img{
    width:100%;
    max-width:650px;
}

/* CARDS */

.cards{
    max-width:1400px;
    margin:30px auto 80px;

    padding:0 60px;

    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:20px;
}

.card{
    background:white;

    border-radius:25px;

    padding:30px 20px;

    text-decoration:none;
    color:#111827;

    text-align:center;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card-icon{
    font-size:48px;
    margin-bottom:15px;
}

.card-title{
    font-size:20px;
    font-weight:700;
}

/* MOBILE */

@media(max-width:1100px){

.hero{
    flex-direction:column;
}

.hero-text h1{
    font-size:60px;
    text-align:center;
}

.cards{
    grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:700px){

.cards{
    grid-template-columns:1fr;
}

.hero-text h1{
    font-size:46px;
}

.logo{
    font-size:30px;
}

}

</style>
</head>

<body>

<!-- LOGO -->

<div class="header">
    <div class="logo">SPEAKORA</div>
</div>

<!-- MOTIVATIONAL TEXT -->

<div class="motivation-bar">
    <span id="quote">Learn something new today.</span>
</div>

<!-- MAIN SECTION -->

<section class="hero">

    <div class="hero-text">

        <h1>
            Learn English<br>
            <span>Smarter</span>
        </h1>

    </div>

    <div class="hero-image">

        <!-- ЗАМЕНИ НА СВОЮ КАРТИНКУ -->
        <img src="background.png" alt="Speakora">

    </div>

</section>

<!-- BUTTONS -->

<div class="cards">

<a href="dashboard.html" class="card">
<div class="card-icon">📊</div>
<div class="card-title">Dashboard</div>
</a>

<a href="courses.html" class="card">
<div class="card-icon">📚</div>
<div class="card-title">Courses</div>
</a>

<a href="learning.html" class="card">
<div class="card-icon">🎯</div>
<div class="card-title">My Learning</div>
</a>

<a href="homework.html" class="card">
<div class="card-icon">📝</div>
<div class="card-title">Homework</div>
</a>

<a href="vocabulary.html" class="card">
<div class="card-icon">💬</div>
<div class="card-title">Vocabulary</div>
</a>

<a href="certificates.html" class="card">
<div class="card-icon">🏆</div>
<div class="card-title">Certificates</div>
</a>

</div>

<script>

const quotes = [

"Learn something new today.",
"Every word counts.",
"Practice makes progress.",
"Speak English with confidence.",
"One lesson closer to fluency.",
"Keep learning. Keep growing.",
"Small steps. Big progress.",
"Your future starts today."

];

let current = 0;

setInterval(() => {

current++;

if(current >= quotes.length){
current = 0;
}

document.getElementById("quote").textContent =
quotes[current];

}, 5000);

</script>

</body>
</html>
```
